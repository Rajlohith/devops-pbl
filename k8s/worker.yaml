apiVersion: apps/v1
kind: Deployment
metadata:
  name: netscope-worker
  namespace: netscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netscope-worker
  template:
    metadata:
      labels:
        app: netscope-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U netscope -d netscope; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done
        - name: wait-for-valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until valkey-cli -h valkey -p 6379 ping | grep -q PONG; do
                echo "Waiting for Valkey..."
                sleep 3
              done
      containers:
        - name: worker
          image: netscope:local
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - wsgi:celery_app
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: netscope-config
          env:
            - name: NETSCOPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netscope-secrets
                  key: NETSCOPE_SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netscope-secrets
                  key: POSTGRES_PASSWORD
            - name: NETSCOPE_DATABASE_URL
              value: "postgresql+psycopg://netscope:$(POSTGRES_PASSWORD)@postgres:5432/netscope"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc

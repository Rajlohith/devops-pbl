{% macro badge(status) %}
{% set colors = {'uploaded': 'bg-slate-200 text-slate-800', 'pending': 'bg-amber-100 text-amber-800', 'processing': 'bg-blue-100 text-blue-800', 'completed': 'bg-green-100 text-green-800', 'failed': 'bg-red-100 text-red-800'} %}
<span class="rounded px-2 py-0.5 text-xs font-medium {{ colors[status.value] }}">{{ status.value }}</span>
{% endmacro %}

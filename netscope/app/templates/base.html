<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetScope{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <nav class="bg-slate-900 text-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="{{ url_for('web.index') }}" class="text-lg font-semibold">NetScope</a>
      {% if current_user.is_authenticated %}
      <div class="flex items-center gap-4 text-sm">
        <a href="{{ url_for('web.captures') }}" class="hover:underline">Captures</a>
        <span class="text-slate-300">{{ current_user.email }}</span>
        <form method="post" action="{{ url_for('web.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="rounded bg-slate-700 px-3 py-1 hover:bg-slate-600">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="mx-auto max-w-5xl px-4 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="mb-4 rounded border px-4 py-3 text-sm {{ 'border-red-300 bg-red-50 text-red-800' if category == 'error' else 'border-green-300 bg-green-50 text-green-800' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

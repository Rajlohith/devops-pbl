[project]
name = "netscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Abhi", email = "akwork607@gmail.com" }]
requires-python = ">=3.12.16"
dependencies = ["fastapi>=0.162.0", "uvicorn[standard]>=0.54.0"]

[tool.uv]
package = true


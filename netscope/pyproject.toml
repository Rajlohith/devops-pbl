[project]
name = "netscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Abhi", email = "akwork607@gmail.com" }]
requires-python = ">=3.12.16"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "scapy>=2.8.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "reportlab>=4.2",
    "gunicorn>=22.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # Optional: enables the real-browser tests in tests/e2e (skipped when absent).
    "playwright>=1.45",
]
